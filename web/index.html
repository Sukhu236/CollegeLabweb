<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="script.js"></script>
    <img src="https://cdn.cgc.ac.in/images/logo-full.png">

    <h1>REGISTERATION FORM</h1>

    <form action="">
        <table>
            <label for="">Enter Name </label>
            <label for=""><input type="text"></label><br><br>

            <label for="">Enter Father name </label>
            <label for=""><input type="text"></label><br><br>

            <label for="">Enter Mother </label>
            <label for=""><input type="text"></label><br><br>

            <label for="">Age</label>
            <label for=""><input type="number"></label><br><br>

            <label for="">Gender </label>
            <label for=""><input type="radio">Male</label>
            <label for=""><input type="radio">Female</label><br><br>

            <label for="">Phone No. </label>
            <label for=""><input type="number" name="" id=""></label><br><br>

            <label for="">Apply For Course </label>
            <label for=""><input type="checkbox" name="" id="">BCA</label>
            <label for=""><input type="checkbox" name="" id="">MCA</label>
            <label for=""><input type="checkbox" name="" id="">BSC</label><br><br>

            <label for="">Enter Email </label>
            <label for=""><input type="text" name="" id=""></label><br><br>

            <label for="">Enter Address</label><br>
            <label for=""><textarea name="" id="" rows="5"></textarea></label><br><br>

            <label for=""><input type="submit" value="Register Now" id="submit"></label><br><br>

        </table>
    </form>
        <marquee behavior="" direction="" id="text">ALERT ! WITHOUT FILLING THE FORM DO NOT CLICK REGISTER NOW</marquee>
</body>
</html>
