<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="image">
        <img src="https://cdn.cgc.ac.in/images/logo-full.png" alt="cgc"/>
    </div>
    <div>
        <form action="https://login.cgc.ac.in/" target="_main">
        <table class="page">
            <tr>
                <th>Login</th>
                <th><input type="text" placeholder="username"><th>
            </tr>
            <tr>
                <th colspan="">Password</th>
                <th> <input type="password" placeholder="password"> </th>
            
            </tr>
            <tr>
            <td colspan="2"><button value="submit">Login</button></td>
            </tr>
        </table>
    </form>
</div>
    
</body>
</html>
